<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>سیستم نوبت‌دهی</title>
<style>*{box-sizing:border-box;font-family:Tahoma}body{background:#f4f6fb;margin:0;padding:16px} .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;max-width:950px;margin-left:auto;margin-right:auto}h1{text-align:center;color:#1a56db}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #ddd;padding:6px;text-align:center}th{background:#eef2ff}input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-top:6px}button{background:#1a56db;color:#fff;border:none;cursor:pointer}.ok{color:green}.full{color:red}</style>
</head><body>
<div class="card"><h1>سیستم نوبت‌دهی ثبت‌نام</h1><div id="conn" style="text-align:center">در حال اتصال...</div><div id="stats" style="text-align:center"></div></div>
<div class="card"><h3>ظرفیت رشته‌ها</h3><table id="publicTable"></table></div>
<div class="card"><h3>دریافت نوبت</h3><input id="name" placeholder="نام"><input id="code" placeholder="کدملی"><input id="phone" placeholder="موبایل"><select id="field"></select><select id="day"><option value="1">روز اول</option><option value="2">روز دوم</option></select><button onclick="reserve()">ثبت نوبت</button><div id="ticket"></div></div>
<script>
var FIELDS=[{n:"پرستاری شهرکرد",cap:[50,50]},{n:"پزشکی شهرکرد",cap:[100,100]},{n:"فوریت پزشکی بروجن",cap:[25,25]},{n:"پرستاری بروجن",cap:[25,25]},{n:"اتاق عمل شهرکرد",cap:[13,12]},{n:"مامایی شهرکرد",cap:[13,12]},{n:"بهداشت عمومی شهرکرد",cap:[13,12]},{n:"بهداشت محیط شهرکرد",cap:[13,12]},{n:"بهداشت مدارس شهرکرد",cap:[13,12]},{n:"بهداشت حرفه‌ای شهرکرد",cap:[13,12]},{n:"هوشبری شهرکرد",cap:[13,12]},{n:"فیزیوتراپی شهرکرد",cap:[13,12]},{n:"رادیولوژی شهرکرد",cap:[13,12]},{n:"علوم آزمایشگاهی شهرکرد",cap:[13,12]},{n:"دندانپزشکی شهرکرد",cap:[13,12]},{n:"اتاق عمل بروجن",cap:[13,12]},{n:"بهداشت عمومی بروجن",cap:[13,12]}];
var records=[];
var fs=document.getElementById("field");
FIELDS.forEach(function(f,i){fs.innerHTML+='<option value="'+i+'">'+f.n+'</option>';});
async function loadAll(){try{var r=await fetch("/api/bookings");records=await r.json();document.getElementById("conn").innerHTML='<span class="ok">متصل ✅</span>';}catch(e){document.getElementById("conn").innerHTML='<span class="full">API ساخته نشده — قدم ۴ را انجام دهید</span>';}render();}
function render(){var h="<tr><th>رشته</th><th>روز۱</th><th>روز۲</th></tr>";FIELDS.forEach(function(f,i){var c1=records.filter(function(x){return x.field==i&&x.day==1;}).length;var c2=records.filter(function(x){return x.field==i&&x.day==2;}).length;h+="<tr><td>"+f.n+"</td><td>"+(f.cap[0]-c1)+" خالی از "+f.cap[0]+"</td><td>"+(f.cap[1]-c2)+" خالی از "+f.cap[1]+"</td></tr>";});document.getElementById("publicTable").innerHTML=h;}
async function reserve(){var o={name:document.getElementById("name").value,code:document.getElementById("code").value,phone:document.getElementById("phone").value,field:+fs.value,day:+document.getElementById("day").value};var r=await fetch("/api/bookings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});var t=await r.text();alert(t);loadAll();}
loadAll();
</script></body></html>
